name: ui_tui

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The TUI is pure Rust and runs on every platform, so it is built on every
  # runner rather than cross-compiled from one.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p editor-tui --all-targets

      - name: Build
        run: cargo build --release -p editor-tui

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: edit-tui-${{ matrix.os }}
          path: |
            target/release/edit-tui
            target/release/edit-tui.exe
          if-no-files-found: error
