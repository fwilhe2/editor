# `cargo deny check licenses bans sources` — `ci.yml`'s `licences` job.
#
# Every licence any dependency is under must be on this list, so a dependency that would change
# what the shipped binaries may be redistributed under fails the build instead of arriving
# quietly in a `cargo update`. The list is the permissive licences the current tree uses; widen
# it deliberately, in the change that needs it, with the reason.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate is a size cost, not a correctness one; `artifacts.yml` is where a
# template that cares would report them.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
