name: core + cli + ffi

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The core and the CLI are pure Rust and ship on all three platforms, so they are
  # built on all three runners. Nothing here cross-compiles: each target OS builds
  # its own binary, the same rule the macOS and Windows shells will follow.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Named crates, not --workspace: ui_linux needs GTK4 and would fail on the
      # macOS and Windows runners.
      - name: Test
        run: cargo test -p editor-core -p editor-cli -p editor-ffi --all-targets

      - name: Build the CLI
        run: cargo build --release -p editor-cli

      - name: Upload the CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edit-${{ matrix.os }}
          path: |
            target/release/edit
            target/release/edit.exe
          if-no-files-found: error

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Clippy covers the whole workspace, so this job needs the GTK shell's
      # system dependencies even though it builds nothing for release.
      - name: Install GTK4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
