[package]
name = "quill-web"
description = "The editor in a browser tab — WebAssembly, drawn into the DOM"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `cdylib` is what `--target wasm32-unknown-unknown` turns into a `.wasm` module; `rlib` keeps
# `cargo test` working on the host, where the DOM-free modules run without a browser.
crate-type = ["cdylib", "rlib"]

[dependencies]
quill-core.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

# web-sys is gated feature by feature: every DOM type this shell touches is listed here, or it
# does not exist.
[dependencies.web-sys]
workspace = true
features = [
  "Blob",
  "CanvasRenderingContext2d",
  "Clipboard",
  "ClipboardEvent",
  "CssStyleDeclaration",
  "DataTransfer",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlButtonElement",
  "HtmlCanvasElement",
  "HtmlDocument",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "InputEvent",
  "KeyboardEvent",
  "MouseEvent",
  "Navigator",
  "Node",
  "NodeList",
  "TextMetrics",
  "Url",
  "WheelEvent",
  "Window",
  "console",
]
