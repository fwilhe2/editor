[package]
name = "editor-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UniFFI surface over the editor core, for the Swift and C# shells"

[lib]
name = "editor_ffi"
# cdylib is what the foreign shells load; lib keeps the crate testable from Rust.
crate-type = ["cdylib", "lib"]

[dependencies]
editor-core.workspace = true
uniffi.workspace = true
thiserror.workspace = true
