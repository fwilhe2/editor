# The formatter is not a place to have opinions: these are rustfmt's own defaults, written down
# so `cargo fmt` is the same operation on every machine and in every editor that runs it on
# save. Everything else worth setting is nightly-only, and a config CI cannot check drifts.
style_edition = "2024"
max_width = 100
