[workspace]
resolver = "2"
members = ["core", "cli", "ffi", "ui_tui", "ui_linux", "ui_web", "ui_egui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
editor-core = { path = "core" }
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
# Pulls in gtk4 as `libadwaita::gtk`; GNOME HIG widgets come from libadwaita itself.
# v1_5 is what AdwAlertDialog needs, and matches the runtime on ubuntu-24.04.
libadwaita = { version = "0.7", features = ["v1_5"] }
# Carries core notifications from the observer onto the GTK main context.
async-channel = "2"
# Pinned to what uniffi-bindgen-cs v0.11.0 targets; the two must match exactly.
uniffi = "0.31"
# The browser shell's binding mechanism — neither a Cargo dependency on the core
# (that is how it reaches the core) nor UniFFI, which has no JavaScript target.
# wasm-bindgen and the `wasm-bindgen` CLI that post-processes the module must be
# the same version; see .github/workflows/web.yml.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
# The portable shell. egui is reached through `eframe::egui`, never as a direct
# dependency, so the two versions cannot drift — the same rule as
# `ratatui::crossterm` and `libadwaita::gtk`.
#
# Deliberately not the default features: those select the wgpu backend and a large
# graphics stack this editor has no use for, while glow runs on software GL, which
# is what a VM or a remote session actually offers. Turning the defaults off also
# drops accesskit, which is put back by hand — it is what makes the shell reachable
# by a screen reader, and what the test harness queries.
eframe = { version = "0.36", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "glow",
  "wayland",
  "x11",
] }
# egui, eframe and egui_kittest are released in lockstep and must share a minor
# version. `eframe::egui` polices two of them; this one is a dev-dependency that
# nothing re-exports, so it is the version to check by hand when eframe moves.
egui_kittest = "0.36"
