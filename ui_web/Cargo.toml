[package]
name = "editor-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser / WebAssembly shell over the editor core"

[lib]
# cdylib is what `cargo build --target wasm32-unknown-unknown` turns into a
# `.wasm` module; rlib keeps `cargo test` working on the host, where the keymap
# runs without a browser.
crate-type = ["cdylib", "rlib"]

[dependencies]
editor-core.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

# web-sys is one crate per web API, gated feature by feature: every DOM type this
# shell touches has to be listed here or it does not exist.
[dependencies.web-sys]
workspace = true
features = [
  "Blob",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlButtonElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "MouseEvent",
  "Node",
  "Url",
  "WheelEvent",
  "Window",
  "console",
]
