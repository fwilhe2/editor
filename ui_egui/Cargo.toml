[package]
name = "editor-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable GUI shell over the editor core, on egui/eframe"

[[bin]]
name = "edit-egui"
path = "src/main.rs"

[dependencies]
editor-core.workspace = true
# egui comes with it, as `eframe::egui`; see the workspace manifest.
eframe.workspace = true

[dev-dependencies]
# Drives the real UI headlessly — no display server, no GPU. The reason this
# shell exists; see doc/decision-egui-shell.md.
egui_kittest.workspace = true
