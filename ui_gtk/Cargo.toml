[package]
name = "quill-gtk"
description = "The editor as a GNOME application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "quill-gtk"
path = "src/main.rs"

[dependencies]
quill-core.workspace = true
# gtk is reached as `libadwaita::gtk` (and pango and cairo as `gtk::pango`, `gtk::cairo`), so
# the versions cannot drift apart.
libadwaita.workspace = true
gtk4.workspace = true
pangocairo.workspace = true
cairo-rs.workspace = true
async-channel.workspace = true

# What a desktop needs to know the application exists: the binary, a `.desktop` file named for
# the application ID, AppStream metainfo, and a scalable icon. `cli/tests/packaging.rs` checks
# all four are listed, here and in the RPM block below.
[package.metadata.deb]
name = "quill-gtk"
section = "editors"
depends = "$auto"
assets = [
    ["target/release/quill-gtk", "usr/bin/", "755"],
    ["data/io.github.fwilhe2.Quill.desktop", "usr/share/applications/", "644"],
    ["data/io.github.fwilhe2.Quill.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/io.github.fwilhe2.Quill.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "quill-gtk"
assets = [
    { source = "target/release/quill-gtk", dest = "/usr/bin/quill-gtk", mode = "755" },
    { source = "data/io.github.fwilhe2.Quill.desktop", dest = "/usr/share/applications/io.github.fwilhe2.Quill.desktop", mode = "644" },
    { source = "data/io.github.fwilhe2.Quill.metainfo.xml", dest = "/usr/share/metainfo/io.github.fwilhe2.Quill.metainfo.xml", mode = "644" },
    { source = "data/io.github.fwilhe2.Quill.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.fwilhe2.Quill.svg", mode = "644" },
]
