# REUSE (https://reuse.software): every file says who wrote it and under which licence, checked
# by `ci.yml`'s `reuse` job. Source files carry an SPDX header; the files below cannot, and are
# declared here instead.

version = 1
SPDX-PackageName = "quill"
SPDX-PackageDownloadLocation = "https://github.com/fwilhe2/editor"

# Generated by cargo, or a picture: a header would be stripped by the next regeneration or would
# change the file's bytes.
[[annotations]]
path = ["Cargo.lock", "ui_win32/data/app.ico", "ui_mac/data/icon.png"]
SPDX-FileCopyrightText = "2026 Florian Wilhelm <fwilhelm.wgt+github@gmail.com>"
SPDX-License-Identifier = "MIT"
